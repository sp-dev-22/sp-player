# Project-wide Gradle settings for SP Player.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
# Configuration cache OFF on purpose: CI runners are ephemeral, so a stored
# cache is discarded after every run anyway (zero benefit), and the
# restoreDebugKeystore task captures script-level paths that the cache
# cannot serialize (CI run #3 failed storing it).
org.gradle.configuration-cache=false
org.gradle.workers.max=4
# In-process Kotlin compilation avoids "could not connect to Kotlin compile daemon"
# errors on low-resource machines (same setting as sp-launcher).
kotlin.compiler.execution.strategy=in-process
